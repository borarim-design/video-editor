<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>모바일 뷰포트 확인 (개발용)</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #111;
        font-family: system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif;
      }
      body {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        gap: 28px;
        padding: 16px;
        flex-wrap: wrap;
      }
      figure {
        margin: 0;
      }
      figcaption {
        color: #888;
        font-size: 12px;
        text-align: center;
        margin-bottom: 6px;
      }
      iframe {
        width: 390px;
        border: 1px solid #333;
        border-radius: 12px;
        background: #0b1220;
        display: block;
      }
    </style>
  </head>
  <body>
    <figure>
      <figcaption>iPhone 14 · 390 × 844</figcaption>
      <iframe id="phone" src="../" height="844" title="390 모바일 미리보기"></iframe>
    </figure>
    <figure>
      <figcaption>같은 390px · 세로로 길게</figcaption>
      <iframe id="tall" src="../" height="1400" title="390 모바일 세로 미리보기"></iframe>
    </figure>
  </body>
</html>
